pan x="547.2">telemetry,</tspan><tspan x="628.3">and</tspan><tspan x="661.7">engineering</tspan><tspan x="756.6">workflows</tspan><tspan x="840.2">because</tspan><tspan x="909.9">less</tspan></text><text y="165" class="inter" font-size="16" fill="#FFF0F5" opacity=".9"><tspan x="60.0">toil</tspan><tspan x="91.7">means</tspan><tspan x="151.1">more</tspan><tspan x="199.2">time</tspan><tspan x="240.8">to</tspan><tspan x="264.8">build</tspan><tspan x="310.8">things</tspan><tspan x="366.2">that</tspan><tspan x="404.2">matter.</tspan><tspan x="466.8">I</tspan><tspan x="480.3">like</tspan><tspan x="515.3">clean</tspan><tspan x="565.2">code,</tspan><tspan x="616.8">reliable</tspan><tspan x="681.1">systems,</tspan><tspan x="757.7">clever</tspan><tspan x="813.6">automation,</tspan><tspan x="911.8">and</tspan></text><text x="60.0" y="190.0" class="inter" font-size="16.0" fill="#FFF0F5" opacity=".9">apparently, 40,000 rows in a spreadsheet is my idea of a good time.</text></svg>