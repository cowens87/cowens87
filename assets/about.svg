@font-face{font-family:'JBMonoB';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}
.monob{font-family:'JBMonoB',ui-monospace, Menlo, Consolas, monospace;font-weight:700;}</style><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22,0 H0 V22" fill="none" stroke="#1B242C" stroke-width="1"/></pattern></defs><rect width="1000" height="150" rx="14" fill="#0F1419"/><text x="60.0" y="40.0" class="monob" font-size="13.0" fill="#D9824A" letter-spacing="1" >01 /</text><text x="104.2" y="40.0" class="monob" font-size="13.0" fill="#E6EDF3" letter-spacing="3" >ABOUT</text><path d="M60,56 H940" stroke="#26313B"/><text x="60.0" y="90.0" class="inter" font-size="16.0" fill="#E6EDF3" opacity=".9">I build the paths code takes to production across AWS and Azure, and the signals that tell us it's healthy. Lately that</text><text x="60.0" y="115.0" class="inter" font-size="16.0" fill="#E6EDF3" opacity=".9">means teaching pipelines and telemetry to lean on AI, so engineers spend less time on toil.</text></svg>