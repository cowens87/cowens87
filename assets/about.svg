<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-labelledby="t d"><title id="t">01 / About</title><desc id="d">I build the paths code takes to production across AWS and Azure, and the signals that tell us it's healthy. Lately that means teaching pipelines and telemetry to lean on AI, so engineers spend less time on toil.</desc><style>@font-face{font-family:'Inter';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}
