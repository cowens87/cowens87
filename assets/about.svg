<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 225" width="1000" height="225" role="img" aria-labelledby="t d"><title id="t">About</title><desc id="d">Software Engineer building the infrastructure, pipelines, and observability that keep code moving and systems healthy across AWS and Azure. I gravitate toward DevOps, automation, performance tuning, and untangling complex systems. Lately, I’ve been putting AI to work in CI/CD, telemetry, and engineering workflows because less toil means more time to build things that matter. I like clean code, reliable systems, clever automation, and apparently, 40,000 rows in a spreadsheet is my idea of a good time.</desc><style>@font-face{font-family:'Inter';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}
