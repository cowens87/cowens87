<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 225" width="1000" height="225" role="img" aria-labelledby="t d"><title id="t">01 / About</title><desc id="d">Software Engineer building the infrastructure, pipelines, and observability that keep code moving and systems healthy across AWS and Azure. I gravitate toward DevOps, automation, performance tuning, and untangling complex systems. Lately, I’ve been putting AI to work in CI/CD, telemetry, and engineering workflows because less toil means more time to build things that matter. I like clean code, reliable systems, clever automation, and apparently, 40,000 rows in a spreadsheet is my idea of a good time.</desc><style>@font-face{font-family:'Inter';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}
.inter{font-family:'Inter',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;}
@font-face{font-family:'JBMonoB';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}
.monob{font-family:'JBMonoB',ui-monospace, Menlo, Consolas, monospace;font-weight:700;}</style><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22,0 H0 V22" fill="none" stroke="#22182A" stroke-width="1"/></pattern></defs><rect width="1000" height="225" rx="14" fill="#150F17"/><text x="60.0" y="40.0" class="monob" font-size="13.0" fill="#FF6FB5" letter-spacing="1" >01 /</text><text x="104.2" y="40.0" class="monob" font-size="13.0" fill="#FFF0F5" letter-spacing="3" >ABOUT</text><path d="M60,56 H940" stroke="#3B2B3D"/><text x="60.0" y="90.0" class="inter" font-size="16.0" fill="#FFF0F5" opacity=".9">Software Engineer building the infrastructure, pipelines, and observability that keep code moving and systems</text><text x="60.0" y="115.0" class="inter" font-size="16.0" fill="#FFF0F5" opacity=".9">healthy across AWS and Azure. I gravitate toward DevOps, automation, performance tuning, and untangling</text><text x="60.0" y="140.0" class="inter" font-size="16.0" fill="#FFF0F5" opacity=".9">complex systems. Lately, I’ve been putting AI to work in CI/CD, telemetry, and engineering workflows because less</text><text x="60.0" y="165.0" class="inter" font-size="16.0" fill="#FFF0F5" opacity=".9">toil means more time to build things that matter. I like clean code, reliable systems, clever automation, and</text><text x="60.0" y="190.0" class="inter" font-size="16.0" fill="#FFF0F5" opacity=".9">apparently, 40,000 rows in a spreadsheet is my idea of a good time.</text></svg>