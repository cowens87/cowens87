name: Build profile

# Rebuilds the README and its images from profile.yml, and refreshes the
# activity panel with your real GitHub data. Runs when profile.yml or the
# design code changes, once a day, and on demand from the Actions tab.

on:
  push:
    branches: [main, master]
    paths: ["profile.yml", ".design/**", ".github/workflows/build-profile.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet fonttools brotli pyyaml

      - name: Fetch activity (contributions + languages)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .design/fetch_activity.py

      - name: Build README and images from profile.yml
        run: python .design/make.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets profile
          git commit -m "Rebuild profile" || exit 0
          git push
